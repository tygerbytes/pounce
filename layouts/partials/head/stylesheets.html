
  <!-- style -->
  {{- $scss_options := (dict "targetPath" "pounce.css" "outputStyle" "compressed" "enableSourceMap" (not hugo.IsProduction) ) -}}
  {{- $styles := resources.Get "scss/all.scss" | css.Sass $scss_options | resources.Fingerprint -}}
  <link rel="stylesheet" href="{{ $styles.Permalink }}" {{ printf "integrity=%q" $styles.Data.Integrity | safeHTMLAttr }}>

  <!-- custom css -->
  {{- range .Site.Params.custom_css -}}
  <link rel="stylesheet" href="{{ . }}">
  {{- end -}}
